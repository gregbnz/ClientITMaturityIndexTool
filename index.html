var AREA_TAB_LABELS = {
  'Strategy, Governance and Investment': 'Strategy',
  'Operations, Platform and Service Delivery': 'Operations',
  'Security & Business Resilience': 'Security',
  'Digital Enablement and Future Capability': 'Digital'
};
function renderTabs() {
  var bar = document.getElementById('area-tabs');
  if (!bar) return;
  bar.innerHTML = GROUPS.map(function(g, i) {
    var label = AREA_TAB_LABELS[g.area] || g.area;
    return '<button class="area-tab' + (i === currentGroup ? ' active' : '') + '" onclick="gotoGroup(' + i + ')">' +
      '<span class="area-tab-num">' + (i+1) + '</span>' + label + '</button>';
  }).join('');
}
function gotoGroup(i) {
  if (i === currentGroup) return;
  saveComments();
  currentGroup = i;
  renderGroup();
  window.scrollTo(0,0);
}


function showIncomplete() {
  var perArea = {};
  AREAS.forEach(function(a){ perArea[a] = 0; });
  for (var i = 0; i < answers.length; i++) {
    if (answers[i] === null) perArea[QUESTIONS[i].area] = (perArea[QUESTIONS[i].area]||0) + 1;
  }
  var total = 0;
  AREAS.forEach(function(a){ total += perArea[a]; });
  document.getElementById('incomplete-summary').textContent =
    total + ' question' + (total === 1 ? ' is' : 's are') +
    ' still unrated. Please rate every question before viewing results.';
  var listEl = document.getElementById('incomplete-list');
  listEl.innerHTML = AREAS.filter(function(a){return perArea[a]>0;}).map(function(a){
    var n = perArea[a];
    return '<li><span class="ma-name">'+escHtml(a)+'</span>' +
           '<span class="ma-count">'+n+' unrated</span></li>';
  }).join('');
  document.getElementById('incomplete-modal').style.display = 'block';
}
function closeIncompleteModal() {
  document.getElementById('incomplete-modal').style.display = 'none';
}

function togglePriority(rank) {
  var row = document.getElementById('prow-'+rank);
  var detail = document.getElementById('pdetail-'+rank);
  if (!row || !detail) return;
  if (detail.style.display === 'none' || !detail.style.display) {
    detail.style.display = 'table-row';
    row.classList.add('open');
  } else {
    detail.style.display = 'none';
    row.classList.remove('open');
  }
}

function buildRadar(areaStats) {
  var W = 400, H = 360, cx = W/2, cy = H/2 + 6, R = 110;
  var n = areaStats.length;
  var SHORT = {
    'Strategy, Governance and Investment': 'Strategy',
    'Operations, Platform and Service Delivery': 'Operations',
    'Security & Business Resilience': 'Security',
    'Digital Enablement and Future Capability': 'Digital'
  };
  function pt(angle, r) {
    return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  }
  var svg = '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  // concentric rings (IML 1..5)
  for (var k = 1; k <= 5; k++) {
    var rr = R * (k/5);
    var pts = [];
    for (var i = 0; i < n; i++) {
      var a = -Math.PI/2 + (i / n) * Math.PI * 2;
      var p = pt(a, rr);
      pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1));
    }
    var cls = 'radar-grid' + (k === 5 ? ' outer' : '');
    svg += '<polygon class="'+cls+'" points="'+pts.join(' ')+'"/>';
    // tick label on top axis
    svg += '<text class="radar-tick" x="'+(cx+4)+'" y="'+(cy - rr + 3)+'">'+k+'</text>';
  }
  // axes + outer labels
  for (var i = 0; i < n; i++) {
    var a = -Math.PI/2 + (i / n) * Math.PI * 2;
    var outer = pt(a, R);
    svg += '<line class="radar-axis" x1="'+cx+'" y1="'+cy+'" x2="'+outer[0].toFixed(1)+'" y2="'+outer[1].toFixed(1)+'"/>';
    var lp = pt(a, R + 22);
    var anchor = 'middle';
    if (lp[0] > cx + 8) anchor = 'start';
    else if (lp[0] < cx - 8) anchor = 'end';
    var label = SHORT[areaStats[i].area] || areaStats[i].area;
    var isHorizontal = anchor !== 'middle';
    var isTop = !isHorizontal && lp[1] < cy;
    var topShift = isTop ? 5 : 0;
    var labelY = (isHorizontal ? lp[1] - 5 : lp[1]) - topShift;
    var scoreY = (isHorizontal ? lp[1] + 4 : lp[1] + 11) - topShift;
    svg += '<text class="radar-label" x="'+lp[0].toFixed(1)+'" y="'+labelY.toFixed(1)+'" text-anchor="'+anchor+'" dominant-baseline="'+(isHorizontal?'auto':'middle')+'">'+label+'</text>';
    var avg = (areaStats[i].score / (areaStats[i].max/5)).toFixed(1);
    svg += '<text class="radar-score" x="'+lp[0].toFixed(1)+'" y="'+scoreY.toFixed(1)+'" text-anchor="'+anchor+'" dominant-baseline="hanging">IML '+avg+'</text>';
  }
  // data shape
  var dataPts = [];
  var dataXY = [];
  for (var i = 0; i < n; i++) {
    var a = -Math.PI/2 + (i / n) * Math.PI * 2;
    var avgIml = areaStats[i].score / (areaStats[i].max/5);
    var rr = R * (avgIml / 5);
    var p = pt(a, rr);
    dataPts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1));
    dataXY.push(p);
  }
  svg += '<polygon class="radar-shape" points="'+dataPts.join(' ')+'"/>';
  dataXY.forEach(function(p){
    svg += '<circle class="radar-pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5"/>';
  });
  svg += '</svg>';
  return svg;
}

function buildDonut(answers) {
  var W = 320, H = 320, cx = W/2, cy = H/2, R = 120;
  var counts = [0,0,0,0,0];
  for (var i = 0; i < answers.length; i++) {
    var v = answers[i];
    if (v >= 1 && v <= 5) counts[v-1]++;
  }
  var total = answers.length;
  var avg = (answers.reduce(function(s,v){return s+v;},0) / total).toFixed(1);
  var circ = 2 * Math.PI * R;
  var svg = '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  svg += '<circle class="donut-track" cx="'+cx+'" cy="'+cy+'" r="'+R+'"/>';
  var offset = 0;
  for (var k = 0; k < 5; k++) {
    var frac = counts[k] / total;
    if (frac <= 0) continue;
    var len = frac * circ;
    var gap = 1.5;
    svg += '<circle class="donut-seg s'+(k+1)+'" cx="'+cx+'" cy="'+cy+'" r="'+R+
      '" stroke-dasharray="'+(len-gap).toFixed(2)+' '+(circ-len+gap).toFixed(2)+
      '" stroke-dashoffset="'+(-offset).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    offset += len;
  }
  svg += '<text class="donut-center-num" x="'+cx+'" y="'+(cy-2)+'">'+avg+'</text>';
  svg += '<text class="donut-center-lbl" x="'+cx+'" y="'+(cy+18)+'">Avg IML</text>';
  svg += '</svg>';
  // legend
  var legend = '<div class="donut-legend">';
  for (var k = 0; k < 5; k++) {
    legend += '<div class="donut-legend-item">' +
      '<span class="donut-legend-dot" style="background:' +
        ['#8B3A2A','#B97A2E','#D69447','#E9A85C','#3F7A78'][k] + '"></span>' +
      (k+1) + ' — ' + IML_LABELS[k] +
      '<span class="donut-legend-count">'+counts[k]+'</span>' +
    '</div>';
  }
  legend += '</div>';
  return { svg: svg, legend: legend };
}

function buildScatter(priorityList) {
  var W = 680, H = 420;
  var ml = 60, mr = 30, mt = 30, mb = 60;
  var pw = W - ml - mr, ph = H - mt - mb;
  var wMin = 2.5, wMax = 5;
  function px(iml, idx) {
    var jitter = ((idx % 7) - 3) * 1.6;
    return ml + ((5 - iml) / 4) * pw + jitter;
  }
  function py(w, idx) {
    var jitter = (((idx * 3) % 7) - 3) * 1.6;
    return mt + ((wMax - w) / (wMax - wMin)) * ph + jitter;
  }

  var svg = '<svg class="scatter-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  // vertical grid + IML labels
  for (var i = 1; i <= 5; i++) {
    var gx = ml + ((5 - i) / 4) * pw;
    svg += '<line class="scatter-grid-line" x1="'+gx+'" y1="'+mt+'" x2="'+gx+'" y2="'+(mt+ph)+'"/>';
    svg += '<text class="scatter-axis-label" x="'+gx+'" y="'+(mt+ph+18)+'" text-anchor="middle">IML '+i+'</text>';
  }
  // horizontal grid + weighting labels
  for (var w = wMin; w <= wMax + 0.001; w += 0.5) {
    var gy = mt + ((wMax - w) / (wMax - wMin)) * ph;
    svg += '<line class="scatter-grid-line" x1="'+ml+'" y1="'+gy+'" x2="'+(ml+pw)+'" y2="'+gy+'"/>';
    svg += '<text class="scatter-axis-label" x="'+(ml-10)+'" y="'+(gy+4)+'" text-anchor="end">'+w.toFixed(1)+'</text>';
  }
  // axes
  svg += '<line class="scatter-axis-line" x1="'+ml+'" y1="'+(mt+ph)+'" x2="'+(ml+pw)+'" y2="'+(mt+ph)+'"/>';
  svg += '<line class="scatter-axis-line" x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(mt+ph)+'"/>';
  // axis titles
  svg += '<text class="scatter-axis-title" x="'+(ml+pw/2)+'" y="'+(H-12)+'" text-anchor="middle">IML rating (lower → higher priority)</text>';
  svg += '<text class="scatter-axis-title" x="18" y="'+(mt+ph/2)+'" text-anchor="middle" transform="rotate(-90 18,'+(mt+ph/2)+')">Weighting</text>';
  // quadrant hints
  svg += '<text class="scatter-quadrant-label" x="'+(ml+pw-10)+'" y="'+(mt+14)+'" text-anchor="end">↗ Quick wins</text>';
  svg += '<text class="scatter-quadrant-label" x="'+(ml+10)+'" y="'+(mt+ph-10)+'" text-anchor="start">Already strong ↙</text>';
  // points
  priorityList.forEach(function(p) {
    var x = px(p.iml, p.idx), y = py(p.w, p.idx);
    var cls = 'scatter-pt' + (p.f ? ' foundational' : '');
    svg += '<circle class="'+cls+'" cx="'+x+'" cy="'+y+'" r="11"/>';
    var lblCls = 'scatter-label' + (p.f ? ' foundational' : '');
    svg += '<text class="'+lblCls+'" x="'+x+'" y="'+(y+3)+'" text-anchor="middle">'+(p.idx+1)+'</text>';
  });
  svg += '</svg>';
  return svg;
}

function exportXLSX() {
  if (typeof XLSX === 'undefined') {
    alert('Excel export library failed to load. Please check your internet connection and try again.');
    return;
  }
  var priorityList = QUESTIONS.map(function(q,i){
    return { idx:i, q:q.q, area:q.area, trait:q.trait, iml:answers[i], w:q.w, f:!!q.f, score:q.w*(6-answers[i]), comments:comments[i]||'' };
  }).sort(function(a,b){
    if (b.score !== a.score) return b.score - a.score;
    if (b.w !== a.w) return b.w - a.w;
    return a.iml - b.iml;
  });

  var now = new Date();
  var dateStr = now.toLocaleDateString('en-NZ', {day:'numeric',month:'long',year:'numeric'});

  var rows = [];
  rows.push(['IT Maturity Assessment — Prioritised Recommendations']);
  rows.push(['Customer', customerName]);
  rows.push(['Assessed by', staffName]);
  rows.push(['Date', dateStr]);
  rows.push(['Total questions', QUESTIONS.length]);
  rows.push([]);
  rows.push(['Rank','Q#','Question','Area','Trait','Foundational','IML','Weight','Comments','Recommendation 1','Recommendation 2','Recommendation 3','Recommendation 4','Recommendation 5']);

  priorityList.forEach(function(p, rank) {
    var recs = RECS[p.idx] || [];
    rows.push([
      rank+1,
      p.idx+1,
      p.q,
      p.area,
      p.trait,
      p.f ? 'Yes' : 'No',
      p.iml,
      Number(p.w.toFixed(1)),
      p.comments,
      recs[0] || '',
      recs[1] || '',
      recs[2] || '',
      recs[3] || '',
      recs[4] || ''
    ]);
  });

  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [
    {wch:6}, {wch:5}, {wch:60}, {wch:32}, {wch:50},
    {wch:13}, {wch:6}, {wch:8}, {wch:55},
    {wch:55}, {wch:55}, {wch:55}, {wch:55}, {wch:55}
  ];

  // Bold the title and header rows; freeze top header
  var titleCell = ws['A1']; if (titleCell) titleCell.s = {font:{bold:true,sz:14}};
  var headerRow = 7;
  ['A','B','C','D','E','F','G','H','I','J','K','L','M','N'].forEach(function(col){
    var ref = col + headerRow;
    if (ws[ref]) ws[ref].s = {font:{bold:true}};
  });
  ws['!freeze'] = { xSplit: 0, ySplit: headerRow };

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Prioritised List');

  var safeName = (customerName || 'IT Maturity').replace(/[\\/:*?"<>|]/g, '');
  var fileName = safeName + ' - Assessment - ' + dateStr + '.xlsx';
  XLSX.writeFile(wb, fileName);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
