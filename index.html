<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IT Maturity Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #0F0F11;
  --bg2:    #18181B;
  --bg3:    #222226;
  --text:   #F4EFE6;
  --text2:  #A39B8E;
  --text3:  #6E665C;
  --bdr:    rgba(244,239,230,0.10);
  --bdr2:   rgba(244,239,230,0.22);
  --accent: #D69447;
  --accent-hi: #E9A85C;
  --accent-lo: #B97A2E;
  --teal:   #3F7A78;
  --r:      10px;
  --rlg:    14px;
}
@media (prefers-color-scheme: light) {
  :root {
    /* Force the dark palette regardless of system preference */
    --bg:    #0F0F11; --bg2: #18181B; --bg3: #222226;
    --text:  #F4EFE6; --text2: #A39B8E; --text3: #6E665C;
    --bdr:   rgba(244,239,230,0.10); --bdr2: rgba(244,239,230,0.22);
    --accent:#D69447;
  }
}

html { font-size:16px; -webkit-font-smoothing:antialiased; }
body { font-family:'DM Sans',system-ui,sans-serif; background:var(--bg); background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(214,148,71,0.10), transparent 60%), radial-gradient(ellipse 60% 40% at 90% 110%, rgba(63,122,120,0.06), transparent 60%); background-attachment:fixed; color:var(--text); min-height:100vh; }

/* ── Persistent top bar (always visible) ── */
#topbar {
  position: sticky; top: 0; z-index: 200;
  background: rgba(15,15,17,0.78);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 0.5px solid var(--bdr);
  padding: 0.65rem 1.25rem;
}
.topbar-inner { max-width:900px; margin:0 auto; display:flex; align-items:center; gap:1rem; }
.topbar-logo { font-size:13px; font-weight:500; color:var(--text); white-space:nowrap; }
.topbar-meta { font-size:12px; color:var(--text3); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:12px; border-left:0.5px solid var(--bdr); margin-left:4px; }
.prog-wrap { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.prog-bar { width:140px; height:3px; background:var(--bdr); border-radius:99px; overflow:hidden; }
.prog-fill { height:100%; background:linear-gradient(90deg,var(--accent-lo),var(--accent-hi)); border-radius:99px; transition:width 0.5s ease; width:0%; box-shadow:0 0 8px -1px rgba(214,148,71,0.5); }
.prog-pct { font-size:12px; color:var(--text3); min-width:32px; text-align:right; }

/* ── Page ── */
.page { max-width:900px; margin:0 auto; padding:0 1.25rem 5rem; }
.screen { display:none; }
.screen.active { display:block; }

/* ── Buttons ── */
.btn { display:inline-flex; align-items:center; gap:6px; height:42px; padding:0 20px; border:0.5px solid var(--bdr2); border-radius:var(--r); background:var(--bg); color:var(--text2); font-size:14px; font-family:inherit; cursor:pointer; transition:background 0.15s,color 0.15s; }
.btn:hover { background:var(--bg2); color:var(--text); }
.btn:active { transform:scale(0.98); }
.btn:disabled { opacity:0.35; cursor:not-allowed; transform:none; }
.btn-primary { background:var(--accent); color:#0F0F11; border-color:var(--accent); font-weight:500; box-shadow:0 0 0 1px rgba(214,148,71,0.35), 0 6px 18px -6px rgba(214,148,71,0.55); transition:background 0.15s, transform 0.15s, box-shadow 0.2s; }
.btn-primary:hover { background:var(--accent-hi); color:#0F0F11; box-shadow:0 0 0 1px rgba(233,168,92,0.55), 0 8px 22px -6px rgba(214,148,71,0.7); transform:translateY(-1px); }

/* ── Intro ── */
.hero { padding:3rem 0 2rem; }
.hero h1 { font-size:clamp(30px,6vw,44px); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:0.75rem; }
.hero p { font-size:16px; color:var(--text2); max-width:460px; }

.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--bdr); border:0.5px solid var(--bdr); border-radius:var(--r); overflow:hidden; margin:2rem 0; }
.stat { background:var(--bg2); padding:1rem 1.25rem; text-align:center; }
.stat-num { font-size:24px; font-weight:400; }
.stat-lbl { font-size:12px; color:var(--text3); margin-top:2px; }

.field-pair { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.5rem; }
@media (max-width:480px) { .field-pair { grid-template-columns:1fr; } }
.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size:13px; font-weight:500; color:var(--text2); }
.field input { height:42px; padding:0 14px; border:0.5px solid var(--bdr2); border-radius:var(--r); background:var(--bg); color:var(--text); font-size:15px; font-family:inherit; outline:none; transition:border-color 0.15s,box-shadow 0.15s; }
.field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(214,148,71,0.20); }


/* ── Section header ── */
.section-hd { padding:2rem 0 1.25rem; border-bottom:0.5px solid var(--bdr); margin-bottom:1.5rem; }
.section-badge { display:inline-block; font-size:11px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent); background:rgba(214,148,71,0.10); border:0.5px solid rgba(214,148,71,0.35); border-radius:99px; padding:3px 10px; margin-bottom:8px; }
.section-hd h2 { font-size:22px; font-weight:400; letter-spacing:-0.01em; margin-bottom:4px; }
.section-hd p { font-size:13px; color:var(--text3); }

/* ── Trait group ── */
.trait-group { margin-bottom:2rem; }
.trait-hd { font-size:15px; font-weight:500; text-transform:none; letter-spacing:-0.005em; color:var(--text); padding:0.9rem 0 0.75rem; border-bottom:0.5px solid var(--bdr); margin-bottom:1rem; line-height:1.4; position:relative; padding-left:14px; }
.trait-hd::before { content:''; position:absolute; left:0; top:1.05rem; bottom:0.85rem; width:3px; background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo)); border-radius:99px; box-shadow:0 0 8px -1px rgba(214,148,71,0.45); }
.q-trait-label { display:block; font-size:11px; font-weight:500; color:var(--text2); margin-bottom:6px; line-height:1.35; }
.section-summary { font-size:14px; line-height:1.55; color:var(--text2); max-width:640px; margin-bottom:6px; }
.section-meta { font-size:12px; color:var(--text3); }

/* ── Question card: two-column layout ── */
.q-card { border:0.5px solid var(--bdr); border-radius:var(--rlg); padding:1.1rem 1.4rem 1.2rem; margin-bottom:0.75rem; background:var(--bg2); transition:border-color 0.2s, transform 0.15s, box-shadow 0.2s; }
.q-card.touched { border-color:rgba(214,148,71,0.40); box-shadow:0 0 0 1px rgba(214,148,71,0.10); }

/* top row: question text + IML badge */
.q-top { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:1rem; }
.q-left { flex:1; min-width:0; }
.q-num { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.05em; color:var(--text3); }
.q-num-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.q-weight { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; background:var(--bg2); border:0.5px solid var(--bdr); border-radius:99px; font-size:10px; font-weight:500; color:var(--text2); letter-spacing:0.04em; text-transform:none; }
.q-weight strong { font-weight:500; color:var(--text); font-variant-numeric:tabular-nums; }
.q-foundational { display:inline-flex; align-items:center; padding:2px 9px; background:var(--accent); color:#0F0F11; border-radius:99px; font-size:10px; font-weight:500; letter-spacing:0.04em; text-transform:none; box-shadow:0 0 0 1px rgba(214,148,71,0.35); }

.pq-weight { display:inline-block; padding:2px 8px; background:#1F1F23; color:#A39B8E; border-radius:99px; font-size:9px; letter-spacing:0.04em; margin-left:8px; }
.pq-weight strong { color:#F4EFE6; font-weight:500; }
.pq-foundational { display:inline-block; padding:2px 8px; background:#B97A2E; color:#ffffff; border-radius:99px; font-size:9px; font-weight:500; letter-spacing:0.04em; margin-left:6px; }

/* Expandable priority rows */
.priority-row { cursor:pointer; }
.priority-row:hover td { background:var(--bg2); }
.priority-row td { transition:background 0.15s; }
.priority-detail-row td { padding:0 !important; border-bottom:0.5px solid var(--bdr); }
.priority-detail { padding:1.1rem 1.25rem; background:var(--bg2); border-left:3px solid var(--accent); box-shadow:inset 4px 0 12px -8px rgba(214,148,71,0.4); }
.priority-detail h4 { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; color:var(--text3); margin-bottom:6px; margin-top:14px; }
.priority-detail h4:first-child { margin-top:0; }
.priority-detail .pd-state { font-size:13px; line-height:1.5; color:var(--text2); padding:9px 13px; background:var(--bg); border-radius:8px; border:0.5px solid var(--bdr); }
.priority-detail ol { padding-left:1.4rem; margin-top:4px; }
.priority-detail li { font-size:13px; line-height:1.6; color:var(--text); margin-bottom:4px; }
.priority-caret { display:inline-block; width:10px; color:var(--text3); transition:transform 0.15s; transform-origin:50% 50%; }
.priority-row.open .priority-caret { transform:rotate(90deg); }

/* Scatter plot */
.scatter-wrap { background:var(--bg2); border-radius:var(--rlg); padding:1.25rem; margin-bottom:1rem; border:0.5px solid var(--bdr); }
.scatter-svg { width:100%; height:auto; display:block; max-width:680px; margin:0 auto; }
.scatter-axis-line { stroke:var(--bdr2); stroke-width:0.6; }
.scatter-grid-line { stroke:var(--bdr); stroke-width:0.5; stroke-dasharray:2,3; }
.scatter-axis-label { font-size:10px; fill:var(--text3); font-family:'DM Sans',sans-serif; }
.scatter-axis-title { font-size:11px; fill:var(--text2); font-family:'DM Sans',sans-serif; font-weight:500; }
.scatter-pt { fill:var(--bg); stroke:var(--accent); stroke-width:1.2; }
.scatter-pt.foundational { fill:var(--accent); stroke:var(--accent-hi); }
.scatter-label { font-size:9px; fill:var(--accent-hi); font-family:'DM Sans',sans-serif; font-weight:500; pointer-events:none; }
.scatter-label.foundational { fill:#0F0F11; }
.scatter-quadrant-label { font-size:10px; fill:var(--text3); font-family:'DM Sans',sans-serif; font-style:italic; }
.scatter-legend { display:flex; gap:18px; justify-content:center; font-size:11px; color:var(--text3); margin-top:10px; flex-wrap:wrap; }
.scatter-legend-item { display:inline-flex; align-items:center; gap:6px; }
.scatter-legend-dot { display:inline-block; width:10px; height:10px; border-radius:50%; border:1px solid var(--accent); background:var(--bg); }
.scatter-legend-dot.solid { background:var(--accent); border-color:var(--accent-hi); }

/* Radar + Donut charts */
.charts-row { display:grid; grid-template-columns:1.3fr 1fr; gap:1rem; margin-bottom:1rem; }
@media (max-width:720px) { .charts-row { grid-template-columns:1fr; } }
.chart-wrap { background:var(--bg2); border-radius:var(--rlg); padding:1.25rem; border:0.5px solid var(--bdr); display:flex; flex-direction:column; }
.chart-title { font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; color:var(--text3); margin-bottom:0.75rem; }
.chart-svg { width:100%; height:auto; display:block; flex:1; }
.radar-grid { stroke:var(--bdr); stroke-width:0.6; fill:none; }
.radar-grid.outer { stroke:var(--bdr2); }
.radar-axis { stroke:var(--bdr); stroke-width:0.5; }
.radar-shape { fill:rgba(214,148,71,0.18); stroke:var(--accent); stroke-width:1.5; stroke-linejoin:round; }
.radar-pt { fill:var(--accent-hi); stroke:var(--bg); stroke-width:1.5; }
.radar-label { font-size:11px; fill:var(--text); font-family:'DM Sans',sans-serif; font-weight:500; }
.radar-tick { font-size:9px; fill:var(--text3); font-family:'DM Sans',sans-serif; }
.radar-score { font-size:10px; fill:var(--accent-hi); font-family:'DM Sans',sans-serif; font-weight:500; }
.donut-track { fill:none; stroke:var(--bdr); stroke-width:14; }
.donut-seg { fill:none; stroke-width:14; transition:stroke-width 0.2s; }
.donut-seg.s1 { stroke:#8B3A2A; }
.donut-seg.s2 { stroke:#B97A2E; }
.donut-seg.s3 { stroke:#D69447; }
.donut-seg.s4 { stroke:#E9A85C; }
.donut-seg.s5 { stroke:#3F7A78; }
.donut-center-num { font-size:28px; font-weight:300; fill:var(--text); font-family:'DM Sans',sans-serif; text-anchor:middle; }
.donut-center-lbl { font-size:10px; fill:var(--text3); font-family:'DM Sans',sans-serif; text-anchor:middle; letter-spacing:0.06em; text-transform:uppercase; }
.donut-legend { display:flex; flex-direction:column; gap:5px; margin-top:10px; font-size:11px; }
.donut-legend-item { display:flex; align-items:center; gap:8px; color:var(--text2); }
.donut-legend-dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
.donut-legend-count { margin-left:auto; color:var(--text3); font-variant-numeric:tabular-nums; }

.q-text { font-size:15px; line-height:1.5; }
.iml-live { flex-shrink:0; text-align:right; }
.iml-score { display:block; font-size:26px; font-weight:300; line-height:1; }
.iml-word { display:block; font-size:11px; color:var(--text3); margin-top:2px; white-space:nowrap; }

/* slider */
input[type="range"] { width:100%; -webkit-appearance:none; appearance:none; height:4px; border-radius:99px; background:var(--bdr); outline:none; cursor:pointer; margin-bottom:6px; display:block; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent); border:3px solid var(--bg); box-shadow:0 0 0 1px var(--accent-lo), 0 0 12px -2px rgba(214,148,71,0.55); cursor:pointer; transition:transform 0.1s, box-shadow 0.15s; }
input[type="range"]::-webkit-slider-thumb:hover { transform:scale(1.18); box-shadow:0 0 0 1px var(--accent-hi), 0 0 18px -2px rgba(214,148,71,0.8); }
input[type="range"]::-moz-range-thumb { width:22px; height:22px; border-radius:50%; background:var(--accent); border:3px solid var(--bg); cursor:pointer; }
.slider-ends { display:flex; justify-content:space-between; font-size:11px; color:var(--text3); margin-bottom:10px; }

/* bottom row: answer box + commentary side by side */
.q-bottom { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:600px) { .q-bottom { grid-template-columns:1fr; } }

.ans-box { background:var(--bg2); border-radius:var(--r); padding:9px 13px; min-height:60px; }
.ans-label { font-size:10px; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; color:var(--text3); margin-bottom:3px; }
.ans-text { font-size:13px; color:var(--text2); line-height:1.5; transition:color 0.15s; }
.ans-text.lit { color:var(--text); }

.comment-box { display:flex; flex-direction:column; gap:4px; }
.comment-label { font-size:10px; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; color:var(--text3); }
.comment-input {
  flex:1; min-height:60px; padding:8px 10px;
  border:0.5px solid var(--bdr2); border-radius:var(--r);
  background:var(--bg); color:var(--text);
  font-size:13px; font-family:inherit; line-height:1.5;
  resize:vertical; outline:none;
  transition:border-color 0.15s, box-shadow 0.15s;
}
.comment-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(214,148,71,0.20); }

.comment-input::placeholder { color:var(--text3); }

/* ── Nav ── */
.nav-row { display:flex; align-items:center; justify-content:space-between; padding-top:1.5rem; margin-top:0.5rem; border-top:0.5px solid var(--bdr); }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:300; }
.modal-card { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--bg); border:0.5px solid var(--bdr); border-radius:var(--rlg); padding:1.5rem 1.75rem; z-index:301; max-width:440px; width:calc(100% - 2rem); box-shadow:0 12px 40px rgba(0,0,0,0.18); }
.modal-card h3 { font-size:18px; font-weight:500; letter-spacing:-0.005em; margin-bottom:8px; }
.modal-card .modal-sub { font-size:13px; color:var(--text2); line-height:1.5; margin-bottom:14px; }
.modal-card ul { list-style:none; margin:0 0 1.25rem; padding:0; border-top:0.5px solid var(--bdr); }
.modal-card li { font-size:13px; padding:8px 2px; border-bottom:0.5px solid var(--bdr); display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.modal-card .ma-name { color:var(--text); }
.modal-card .ma-count { color:var(--text3); font-variant-numeric:tabular-nums; white-space:nowrap; }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; }

.q-card.untouched .iml-score { color:var(--text3); font-weight:300; }
.q-card.untouched .iml-word  { color:var(--text3); font-style:italic; }
.q-card.untouched input[type="range"]::-webkit-slider-thumb { background:var(--bg); box-shadow:0 0 0 1.5px var(--bdr2) inset, 0 0 0 1px var(--bdr2); }
.q-card.untouched input[type="range"]::-moz-range-thumb { background:var(--bg); border-color:var(--bdr2); }
.q-card.untouched .ans-text { font-style:italic; color:var(--text3); }
.prog-pct { font-variant-numeric:tabular-nums; }
/* Prevent stray text-selection during slider drag */
.q-card { -webkit-user-select:none; user-select:none; }
.q-card .q-text, .q-card .ans-text, .q-card .q-trait-label, .q-card .comment-input { -webkit-user-select:text; user-select:text; }
.q-card input[type="range"] { touch-action:none; }
.q-card input[type="range"]::-webkit-slider-thumb { cursor:grab; }
.q-card input[type="range"]:active::-webkit-slider-thumb { cursor:grabbing; }

.area-tabs { display:flex; gap:4px; margin:1.5rem 0 0; padding:4px; background:var(--bg2); border:0.5px solid var(--bdr); border-radius:var(--r); overflow-x:auto; }
.area-tab { flex:1; min-width:0; padding:9px 14px; background:transparent; border:0; border-radius:calc(var(--r) - 3px); font-family:inherit; font-size:13px; color:var(--text2); cursor:pointer; white-space:nowrap; transition:background 0.15s, color 0.15s; text-align:center; font-weight:500; }
.area-tab:hover { color:var(--text); }
.area-tab.active { background:var(--bg); color:var(--accent-hi); box-shadow:0 1px 2px rgba(0,0,0,0.5), inset 0 -2px 0 var(--accent); }

.area-tab-num { display:inline-block; font-size:10px; color:var(--text3); margin-right:6px; font-variant-numeric:tabular-nums; }
.area-tab.active .area-tab-num { color:var(--text2); }
@media (max-width:560px) { .area-tab { font-size:12px; padding:8px 10px; } .area-tab-num { display:none; } }

.nav-info { font-size:13px; color:var(--text3); }

/* ── Results ── */
.res-hd { padding:2.5rem 0 2rem; border-bottom:0.5px solid var(--bdr); margin-bottom:2rem; }
.eyebrow { font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); margin-bottom:1rem; }
.res-hd h1 { font-size:clamp(26px,5vw,38px); font-weight:400; letter-spacing:-0.02em; margin-bottom:4px; }
.res-hd p { font-size:14px; color:var(--text3); }
.meta-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:1.5rem; }
@media (max-width:400px) { .meta-grid { grid-template-columns:1fr; } }
.meta-card { background:var(--bg2); border-radius:var(--r); padding:0.875rem 1rem; }
.meta-card .lbl { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:3px; }
.meta-card .val { font-size:15px; font-weight:500; }
.score-display { text-align:center; padding:2.5rem 1rem; border:0.5px solid var(--bdr); border-radius:var(--rlg); background:radial-gradient(ellipse at center top, rgba(214,148,71,0.08), var(--bg2) 60%); margin-bottom:1.5rem; position:relative; overflow:hidden; }
.score-lbl { font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text3); margin-bottom:10px; }
.score-big { font-size:clamp(54px,14vw,84px); font-weight:300; letter-spacing:-0.03em; line-height:1; }
.score-denom { font-size:22px; color:var(--text3); }
.score-pct { font-size:18px; color:var(--text2); margin-top:6px; }
.iml-chip { display:inline-block; margin-top:14px; padding:6px 20px; border:0.5px solid rgba(214,148,71,0.35); background:rgba(214,148,71,0.08); border-radius:99px; font-size:13px; color:var(--accent-hi); letter-spacing:0.02em; }
.breakdown { margin-bottom:2rem; }

  {area:'Strategy, Governance and Investment',trait:'Clear IT governance and decision‑making structures',q:'How are IT investment decisions usually prioritised and approved?',a:['Prioritization is based on immediate crises or the influence of individual department heads.','Investment requests are reviewed ad-hoc without a standardized framework for comparing value.','A standard scoring model prioritizes investments based on cost; risk; and general business benefit.','A multi-stakeholder board prioritizes investments using detailed business cases and projected ROI metrics.','Resource allocation is dynamic and data-driven; automatically shifting to the highest-value opportunities in real-time.'],w:2.9,f:1},
  {area:'Strategy, Governance and Investment',trait:'Clear IT governance and decision‑making structures',q:'How are technology‑related risks identified and managed within the organisation?',a:['Risk management is non-existent or purely reactive after a significant security or operational failure.','Risks are identified informally but are not documented in a central register or tracked over time.','A formal technology risk register is maintained and reviewed quarterly by IT leadership.','IT risk is integrated into the enterprise risk management framework with clear business mitigation owners.','AI-driven analytics provide autonomous; real-time visibility into the organization’s total risk and compliance posture.'],w:3.5},
  {area:'Strategy, Governance and Investment',trait:'Clear IT governance and decision‑making structures',q:'What is the level of alignment between IT and the broader business planning process?',a:['IT and business planning are entirely disconnected; often resulting in mismatched goals and timelines.','IT planning follows business planning with a significant delay; leading to reactive technology execution.','The IT roadmap is aligned to the annual business plan to support identified operational priorities.','Planning is a continuous and collaborative process where IT and business goals are co-developed.','Business planning is tech-led; where digital capabilities define the possible scope of business strategy.'],w:3.2},
  {area:'Strategy, Governance and Investment',trait:'Effective IT investment approach',q:'How does the organisation typically approach IT funding across capital and operational expenditure?',a:['Funding is unplanned and reactive; occurring only when hardware breaks.','Budgets are managed in departmental silos with little coordination between CapEx and OpEx.','IT budgets are set annually with a clear distinction between maintenance and project spend.','A balanced multi-year funding model supports continuous lifecycle management and debt reduction.','Dynamic outcome-based funding allows IT to pivot resources rapidly to innovation opportunities.'],w:3.6},
  {area:'Strategy, Governance and Investment',trait:'Effective IT investment approach',q:'From a financial perspective, how is IT spend reviewed and managed?',a:['Spend is tracked via basic invoices with no central oversight or review.','IT costs are reviewed monthly against a high-level budget focusing on minimizing expenses.','Formal monthly reviews track variance across infrastructure and licensing with cost-center allocation.','Advanced FinOps practices provide granular visibility into cloud and service costs with active optimization.','IT spend is managed as a value-driven investment portfolio with real-time transparency.'],w:3.3},
  {area:'Strategy, Governance and Investment',trait:'Effective IT investment approach',q:'How do you assess visibility and confidence in IT spend relative to the value it delivers?',a:['There is zero visibility into the ROI or business value of technology spending.','Leadership views IT spend as a necessary burden rather than a contributor to business value.','Major project costs are tracked against basic delivery milestones to ensure project accountability.','Formal value-realization metrics track the direct impact of technology spend on operational efficiency.','High confidence exists as automated dashboards link IT consumption directly to business growth.'],w:3.2,f:1},
  {area:'Strategy, Governance and Investment',trait:'Effective IT investment approach',q:'How are IT investment opportunities evaluated and prioritised over time?',a:['Investments are prioritized by the loudest voice or the most urgent technical failure.','Projects are selected based on executive requests without a standardized evaluation framework.','A scoring system evaluates project requests based on cost risk and broad business alignment.','A structured steering committee prioritizes investments using detailed business cases and ROI projections.','Continuous portfolio management prioritizes high-impact innovation based on real-time market needs.'],w:3.2,f:1},
  {area:'Strategy, Governance and Investment',trait:'Effective IT investment approach',q:'How would you describe relationships with key technology vendors – more transactional, or more strategic?',a:['Relationships are purely transactional focusing only on the lowest purchase price during procurement.','Vendors are managed as basic service providers with interactions limited to renewals and support.','Key partners are identified and managed through regular account reviews and service monitoring.','Strategic partners are integrated into long-term roadmapping and co-design of future solutions.','Partnerships are deep and collaborative sharing risk and reward to drive joint innovation.'],w:3.1},
  {area:'Strategy, Governance and Investment',trait:'Well constructed IT Organization',q:'How has the IT organization been constructed?',a:['IT roles are undefined with individuals performing jack-of-all-trades support tasks.','The team is structured around legacy technology silos with limited cross-functional collaboration.','A clear organizational chart defines functional teams with specific responsibilities.','The structure is modernized around service-delivery and product teams that align with business functions.','A highly agile organization utilizes global talent and automated platforms to scale with demand.'],w:3.2},
  {area:'Strategy, Governance and Investment',trait:'Well constructed IT Organization',q:'Where does IT report and to whom?',a:['IT reports to a middle manager and is excluded from all executive-level discussions.','IT reports to Finance or Operations as a support function rather than a strategic partner.','IT leadership reports to the CEO and participates in regular management team meetings.','IT is a core member of the executive leadership team influencing every major business decision.','The technology leader is a peer to the business owners co-leading the strategic direction.'],w:2.8},
  {area:'Strategy, Governance and Investment',trait:'Well constructed IT Organization',q:'How are key personnel compensated, and evaluated?',a:['Compensation is flat and evaluations are informal focusing only on basic task completion.','Performance is measured by basic uptime metrics with standard cost-of-living salary increases.','Personnel have formal KPIs linked to technical performance and professional development goals.','Compensation includes incentives tied to successful project delivery and measurable efficiency gains.','Evaluations are based on innovation and value-creation with incentives linked to company growth.'],w:3.2},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient IT Operations & Infrastructure',q:'Is there a comprehensive, regularly updated architecture guiding all infrastructure decisions?',a:['No formal architecture exists; systems are built ad-hoc as needs arise.','A basic network diagram exists but does not guide future purchasing decisions.','A documented Enterprise Architecture guides standard infrastructure deployments and lifecycle replacements.','Advanced architecture frameworks drive continuous optimization and modernization of all platforms.','Architecture is dynamic and self-documenting automatically enforcing standards through policy-driven code.'],w:3.8},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient IT Operations & Infrastructure',q:'Is the infrastructure based on cloud‑first, scalable platforms with effective use of current technology (e.g., PaaS / automation, Infrastructure as Code, etc.)?',a:['Infrastructure is entirely on-premises manual and relies on aging legacy hardware.','A lift-and-shift cloud approach is used treating cloud servers like on-premises VMs.','A hybrid cloud strategy is in place with significant use of managed PaaS services.','Cloud-native principles and Infrastructure as Code (IaC) drive the majority of environment deployments.','Fully automated serverless architecture scales dynamically and self-heals without human intervention.'],w:4.2},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient IT Operations & Infrastructure',q:'Are all significant operations and infrastructure monitored, observed and performance proactively managed in real time?',a:['Monitoring is non-existent; IT learns about failures when users report them.','Basic up/down monitoring alerts IT to hardware failures after they have occurred.','Centralized logging and alerting provide real-time visibility into the health of all critical systems.','Automated remediation scripts respond to monitoring signals to fix issues in real-time.','Full-stack observability and AIOps predicts and remediates performance degradation before user impact occurs.'],w:4.1,f:1},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient IT Operations & Infrastructure',q:'How much of infrastructure and operations management, patching, and maintenance is policy‑driven and automated?',a:['All patching and maintenance are performed manually and irregularly by IT staff.','Basic automated tools are used for OS patching but maintenance remains a manual effort.','Policy-driven update management ensures all systems are patched within defined monthly windows.','Infrastructure is maintained as code with automated CI/CD pipelines managing all configuration.','Governance is enforced by automated policy preventing non-compliant or unpatched resources from existing.'],w:4.2},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient IT Operations & Infrastructure',q:'How quickly can infrastructure and operations environments be recovered or rebuilt if degraded?',a:['Recovery is manual and slow often taking days or weeks to rebuild from scratch.','Environments can be recovered from traditional backups but the process is time-consuming.','Documented recovery procedures and server images allow for restoration within 24-48 hours.','Automated recovery orchestration allows full site restoration within hours using modern replication tools.','Environments are immutable and can be redeployed from code in minutes to a known-good state.'],w:4.5},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient End-User IT support',q:'How effectively and efficiently do you training all end user on how to leverage available technology and upskill them as appropriate (e.g., for AI)?',a:['No formal training exists; users are left to self-teach or use word-of-mouth.','Periodic training is provided via documents or videos but lacks engagement tracking.','Formal training sessions are scheduled during major rollouts with basic completion tracking.','Proactive digital literacy programs utilize champions and data to target specific skill gaps.','A continuous learning culture is embedded using automated platforms to drive deep technology adoption.'],w:3.5},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient End-User IT support',q:'How effectively and efficiently do you support the ad hoc requirements of end‑user’ IT infrastructure?',a:['Support is entirely reactive and slow with no formal tracking of end-user requests.','A basic helpdesk handles requests manually with inconsistent resolution times.','Standardized service catalogs allow users to log requests with defined SLA tracking.','Automated self-service portals and zero-touch provisioning handle the majority of hardware requests.','Predictive analytics identify and resolve device issues before the end-user even notices a problem.'],w:3.5},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient End-User IT support',q:'How effectively and efficiently do you support the end‑users’ applications needs?',a:['Application support is ad-hoc with users frequently bypassing IT for fixes.','IT provides basic support for core applications but lacks specialized expertise for modern apps.','A dedicated team manages application support with documented troubleshooting and update guides.','Application lifecycles are managed through automated deployment and self-service software centers.','Users are empowered with automated help and AI assistants that resolve app issues instantly.'],w:3.8,f:1},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient End-User IT support',q:'How do you securely provide support to your remote workforce?',a:['Remote support is difficult and insecure; often requiring users to return to the office.','Support is provided via basic VPN and remote desktop tools with manual intervention.','Modern remote management tools (e.g. Intune) provide secure support regardless of user location.','Secure remote support is integrated into the workspace with automated health checks and identity verification.','A global zero-trust support model provides seamless secure assistance and device recovery anywhere in the world.'],w:3.5,f:1},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient End-User IT support',q:'How responsive and consistent is end‑user support?',a:['Response times are long and unpredictable with high variation in quality between staff.','Support is consistent for basic issues but complex problems often go unresolved.','Defined SLAs and KPIs drive consistent response and resolution times for all support tiers.','Data-driven support queues prioritize issues based on business impact with high first-call resolution.','AI-driven support triage and resolution provide near-instant consistent responses for all common requirements.'],w:3.9,f:1},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient support to Applications/DevOps',q:'How effectively and efficiently does IT support business‑critical applications?',a:['Critical apps are managed reactively with significant downtime during updates or failures.','Standard maintenance is performed but the relationship between IT and App owners is siloed.','Defined service levels and regular health checks ensure stability for all business-critical apps.','Proactive application monitoring and automated scaling ensure high performance and availability.','Applications are managed as modern digital products with continuous integration and zero-downtime deployments.'],w:3.9,f:1},
  {area:'Operations, Platform and Service Delivery',trait:'Effective and efficient support to Applications/DevOps',q:'How effective is the RACI between the IT Infrastructure and Application teams (DevOps)?',a:['No formal RACI exists; teams often blame each other during outages or deployments.','Roles are documented but communication is infrequent leading to friction during complex changes.','A clear RACI is in place with regular joint planning meetings between Infrastructure and App teams.','Teams utilize shared tools and automated pipelines to coordinate infrastructure and application changes.','A true DevOps culture exists with cross-functional teams owning the entire lifecycle from code to production.'],w:3.3},
  {area:'Security & Business Resilience',trait:'Assured continuity of operations in the event of outages, hacks and other disruptions',q:'Do you perform Business Continuity planning for continued operating during an outage [for any reason]?',a:['No formal BCP exists; the organization relies on best effort during an outage.','An informal BCP exists but is not documented or shared across the organization.','A documented BCP identifies critical business functions and manual workarounds during failure.','BCP is integrated into operations with regular staff training and annual tabletop simulations.','Resilience is built into the business model with seamless transitions to alternative operating modes.'],w:4.2,f:1},
  {area:'Security & Business Resilience',trait:'Assured continuity of operations in the event of outages, hacks and other disruptions',q:'Do you have defined, achievable and validated RTO/RPO objectives for critical systems, based on the business impact if a major system is unavailable?',a:['Recovery targets are undefined and have never been discussed with business owners.','General recovery targets exist but are not validated against actual technical capabilities.','Specific RTO/RPO targets are documented for all critical systems and agreed upon by the business.','Recovery targets are technically validated through quarterly testing to ensure requirements are met.','Near-zero RTO/RPO targets are achieved through continuous replication and automated failover.'],w:4.2},
  {area:'Security & Business Resilience',trait:'Assured continuity of operations in the event of outages, hacks and other disruptions',q:'Do you have immutable, recoverable and regularly tested backups of all data and systems?',a:['Backups are inconsistent manual and have not been tested for recovery in over a year.','Automated daily backups exist but are stored on-site and are vulnerable to ransomware.','Off-site automated backups are performed daily with monthly sample recovery tests to verify integrity.','Immutable air-gapped backups protect against ransomware with automated success-rate reporting.','Continuous multi-region data protection ensures backups are always available and instantly recoverable.'],w:4.2,f:1},
  {area:'Security & Business Resilience',trait:'Assured continuity of operations in the event of outages, hacks and other disruptions',q:'Do you have regularly tested High Availability  and Disaster Recovery plans, using techniques such as Chaos Engineering & Stress Testing, which achieve your RTO/RPO objectives?',a:['No HA or DR plans exist; recovery is manual and untested.','Basic DR plans exist but are not regularly tested or aligned to business requirements.','High Availability is configured for critical systems with annual DR testing to validate targets.','Automated failover and regular chaos engineering exercises ensure recovery targets are always met.','Resilience is continuous and self-healing with automated recovery validation across all regions.'],w:4.2},
  {area:'Security & Business Resilience',trait:'Effective cyber security to protect the company’s data, IP and infrastructure from current and evolving threats',q:'Do you perform structured cyber risk identification utilizing a comprehensive asset inventory and risk register; and update on a regular basis?',a:['Risk identification is non-existent; assets are not tracked and no risk register exists.','Partial asset lists exist but are not linked to a formal risk assessment process.','A comprehensive asset inventory and risk register are maintained and reviewed quarterly.','Automated asset discovery and continuous risk assessments are integrated into the security posture.','Real-time asset intelligence and risk-scoring drive proactive security investments and response.'],w:3.7},
  {area:'Security & Business Resilience',trait:'Effective cyber security to protect the company’s data, IP and infrastructure from current and evolving threats',q:'How effective and tightly controlled are your identity and access management systems?',a:['Passwords are weak MFA is not enforced and former employees retain access indefinitely.','MFA is used for some systems but identity management remains manual and decentralized.','Centralized identity (SSO) and MFA are enforced for all users and critical applications.','Conditional Access policies and Just-In-Time admin rights ensure secure risk-based access control.','Full Zero-Trust architecture continuously verifies every access request based on full device context.'],w:4.2,f:1},
  {area:'Security & Business Resilience',trait:'Effective cyber security to protect the company’s data, IP and infrastructure from current and evolving threats',q:'Have you defined and implemented vulnerability and patch management processes?',a:['Patching is performed manually and irregularly with no tracking of vulnerabilities.','Basic automated patching is in place for OS but third-party apps remain unmanaged.','A formal patch management policy ensures all critical systems are updated monthly.','Vulnerability scanning and automated patching are integrated into a risk-based remediation workflow.','Real-time vulnerability orchestration automatically remediates threats across all endpoints and cloud resources.'],w:4.2},
  {area:'Security & Business Resilience',trait:'Effective cyber security to protect the company’s data, IP and infrastructure from current and evolving threats',q:'Do you perform continuous threat detection, monitoring and posture management, capable of countering the current and evolving threat landscape?',a:['Threat detection is non-existent; IT learns of breaches from external sources.','Basic antivirus and log checking provide limited visibility into security events.','A centralized SOC or SIEM provides 24/7 monitoring and alerting for critical security events.','XDR and automated threat hunting provide proactive detection and response across the environment.','AI-driven security operations provide autonomous threat detection and posture management in real-time.'],w:4.1,f:1},
  {area:'Security & Business Resilience',trait:'Effective cyber security to protect the company’s data, IP and infrastructure from current and evolving threats',q:'Do you have a documented and tested incident response capability?',a:['No incident response plan exists; breaches are handled ad-hoc by IT.','A basic IR plan is documented but has never been tested with stakeholders.','A formal IR plan defines roles and procedures with annual tabletop testing.','Automated IR playbooks and a 24/7 response partner ensure rapid containment of breaches.','Incident response is integrated into a continuous improvement cycle using AI to predict and block attacks.'],w:4.0,f:1},
  {area:'Security & Business Resilience',trait:'Effective cyber security to protect the company’s data, IP and infrastructure from current and evolving threats',q:'Is cyber security awareness embedded, and owned, across the organization?',a:['No security training is provided; users are unaware of common threats like phishing.','Annual security training is mandated but there is no measurement of behavior change.','Regular phishing simulations and monthly awareness updates drive a foundational security culture.','Security is a shared responsibility with department champions and clear reporting of suspicious activity.','A proactive security-first culture is embedded in all business processes driven by executive leadership.'],w:3.5,f:1},
  {area:'Digital Enablement and Future Capability',trait:'Modern Digital Workplace, Experience & Adoption',q:'How well does IT train and enable the workforce to utilize all available technology assets to work productively, effectively, securely and flexibly?',a:['Training is non-existent; users struggle to use basic productivity tools effectively.','Ad-hoc training is provided but lacks a cohesive strategy for modern ways of working.','A formal digital enablement program provides targeted training for M365 and remote work.','Proactive coaching and data-driven learning paths drive high productivity across all digital tools.','IT is a business enabler providing seamless onboarding and advanced digital literacy for every role.'],w:3.5},
  {area:'Digital Enablement and Future Capability',trait:'Modern Digital Workplace, Experience & Adoption',q:'Do you proactively monitor and measure employee experience and use of (current and) of available technology assets ?',a:['Employee experience is not measured; IT is unaware of user frustration.','Ad-hoc surveys provide occasional feedback on user satisfaction with IT.','Standard DEX tools monitor device health and basic application performance.','Comprehensive telemetry measures digital friction and employee sentiment across the entire estate.','AI-driven insights proactively improve the digital experience before employees encounter friction.'],w:3.6},
  {area:'Digital Enablement and Future Capability',trait:'Modern Digital Workplace, Experience & Adoption',q:'Do you understand and address the challenges in workforce adoption and use of available technology assets?',a:['Adoption challenges are ignored; technology is deployed without regard for user use.','IT is aware of low adoption but lacks a formal process to address it.','A formal change management process identifies and addresses adoption barriers for new tools.','Data-driven adoption programs target specific groups to maximize the value of existing tech.','Continuous feedback loops and AI-assisted support ensure frictionless adoption of all new capabilities.'],w:3.3},
  {area:'Digital Enablement and Future Capability',trait:'Comprehensive use of Automation as appropriate',q:'What is IT’s role in process automation?',a:['IT has no role in automation; business processes are manual or siloed.','IT provides basic tools for automation but does not lead or support initiatives.','IT leads a centralized automation team that delivers projects for specific business units.','IT provides a governed platform for citizen developers to build their own automations.','IT is an automation-first organization where every repeatable process is candidates for AI/RPA.'],w:3.9},
  {area:'Digital Enablement and Future Capability',trait:'Comprehensive use of Automation as appropriate',q:'Is there a systematic, comprehensive approach to identify, prioritize, plan and prosecute potential areas of automation across the company?',a:['Automation opportunities are identified ad-hoc with no formal prioritization.','A list of potential automation projects exists but lacks a structured delivery plan.','A formal automation roadmap prioritizes projects based on complexity and business benefit.','A center of excellence (CoE) proactively identifies and delivers automation across all departments.','Automation is core to the business strategy with a continuous pipeline of high-impact initiatives.'],w:3.8},
  {area:'Digital Enablement and Future Capability',trait:'Comprehensive use of Automation as appropriate',q:'What have been and what are projected to be the ROI with each discrete automation initiative?',a:['ROI for automation is not measured or tracked.','Basic time-savings are estimated but not validated after implementation.','Standardized ROI models track the financial and operational impact of all major automations.','Comprehensive value tracking measures hard and soft savings across the entire automation portfolio.','Automation ROI is visible in real-time with continuous optimization of bots and workflows for value.'],w:3.3},
  {area:'Digital Enablement and Future Capability',trait:'Effective approach for reviewing Innovation & AI to provide for performance improvement and competitive differentiation',q:'Is there a defined IT Innovation / AI strategy, encompassing governance and responsible use (including personal AI accounts with company data), tied to clear business goals?',a:['No AI strategy exists; users utilize shadow AI without any governance.','A high-level AI policy exists but is not linked to business goals or technical controls.','A formal AI strategy defines governed use cases and ethical guardrails for the business.','The AI strategy is integrated into the business roadmap with specific investment in secure AI platforms.','Innovation is constant with AI embedded in the business model under autonomous ethical governance.'],w:3.6},
  {area:'Digital Enablement and Future Capability',trait:'Effective approach for reviewing Innovation & AI to provide for performance improvement and competitive differentiation',q:'Does you provide AI (and other innovation tools) to all users outside of devops, such that end users can build, deploy, test, iterate, and learn from AI failures? Is AI AI integrated into real workflows, secure and delivering measurable outcomes?',a:['AI access is restricted to IT or blocked entirely for general users.','Users have access to public AI tools but with no integration into business workflows.','Enterprise AI tools (e.g. Copilot) are provided with basic training for standard users.','AI is integrated into core business workflows with secure sandboxes for user experimentation.','Every employee is an innovator with AI assistants co-creating value across all secure workflows.'],w:3.8},
  {area:'Digital Enablement and Future Capability',trait:'Effective approach for reviewing Innovation & AI to provide for performance improvement and competitive differentiation',q:'Does you provide "Just-Enough-Access" to ensure that LLMs don\'t index and expose sensitive or over-shared internal data while fostering a "Citizen Developer" community where business users build their own AI-driven automations under IT guardrails?',a:['Data access is ungoverned; AI models risk exposing sensitive internal information.','Basic permissions are in place but data over-sharing remains a significant risk.','Data classification and sensitivity labels protect sensitive info from being indexed by AI.','A zero-trust data model and governed Power Platform enable safe citizen development at scale.','AI-driven governance automatically protects sensitive data while allowing full innovation freedom.'],w:3.7},
  {area:'Digital Enablement and Future Capability',trait:'Effective approach for reviewing Innovation & AI to provide for performance improvement and competitive differentiation',q:'Do you measure the specific value AI delivers (e.g., time saved)?',a:['AI value is not measured; use is considered experimental only.','Qualitative feedback is collected on AI use but lacks financial metrics.','Standardized metrics track time-savings and productivity gains from AI tool adoption.','Comprehensive value-realization dashboards track AI impact on business growth and innovation.','AI value is measured in real-time as a core driver of business profitability and performance.'],w:3.0},
  {area:'Digital Enablement and Future Capability',trait:'Comprehensive, Usable, Data Intelligence, Analytics and Information Management',q:'Do you have a single source of truth, centralized data repository (e.g., Data Warehouse or Data Lake) that is used as the primary source for reporting',a:['Data is stored in disconnected spreadsheets and departmental silos with no centralized reporting.','A basic data repository exists but requires manual data entry and suffers from poor accuracy.','A centralized Data Warehouse or Lakehouse provides a single source of truth for all key reporting.','Advanced data pipelines automate the flow of real-time data into a unified analytics platform.','A self-healing data ecosystem provides a unified view of the business to all users and AI models.'],w:4.1},
  {area:'Digital Enablement and Future Capability',trait:'Comprehensive, Usable, Data Intelligence, Analytics and Information Management',q:'Have you categorized your data (e.g., as IP or PII) and implemented access and data management systems appropriately allow access to your data?',a:['Data is not categorized; access is granted ad-hoc with high risk of exposure.','Manual data classification is attempted but is incomplete and rarely updated.','A formal data classification policy is enforced with automated tagging for sensitive data.','Identity-governed data access ensures only authorized users can see sensitive IP or PII.','AI-driven data management automatically classifies and secures all data throughout its lifecycle.'],w:3.6},
  {area:'Digital Enablement and Future Capability',trait:'Comprehensive, Usable, Data Intelligence, Analytics and Information Management',q:'Is the movement of data from source systems (ERP, CRM) to the warehouse automated and monitored for failure?',a:['Data movement is manual; involving fragmented exports and spreadsheet imports.','Basic ETL scripts move data but lack centralized monitoring or failure alerting.','Automated data pipelines move data nightly with central monitoring and IT alerts.','Real-time data streaming and automated error remediation ensure data is always fresh and accurate.','Autonomous data orchestration manages all pipelines with self-healing capabilities for zero downtime.'],w:3.9},
  {area:'Digital Enablement and Future Capability',trait:'Comprehensive, Usable, Data Intelligence, Analytics and Information Management',q:'Can business users easily and effectively “self-service” with AI and other tools to do their own analysis and reporting (e.g., via Power BI) using the centralized data repository ?',a:['Users must request all reports from IT leading to long delays and manual workarounds.','Some users have access to BI tools but lack the training or clean data to be effective.','Certified datasets and standardized BI tools allow trained users to build their own reports.','A robust self-service portal provides all users with access to pre-modeled data and AI insights.','Data is democratized with users building sophisticated governed analytics and automations independently.'],w:3.9},
  {area:'Digital Enablement and Future Capability',trait:'Comprehensive, Usable, Data Intelligence, Analytics and Information Management',q:'Have you implemented an effective, policy-driven approach to Data Retention & Archiving?',a:['No data retention policy exists; all data is kept indefinitely by default.','A formal retention policy is documented but relies on manual deletion by users.','Policy-driven automated retention and archiving are implemented for core business systems.','Comprehensive data lifecycle management automatically archives or deletes data based on risk and value.','AI-driven data governance optimizes retention to minimize risk and storage costs automatically.'],w:3.1},
  {area:'Digital Enablement and Future Capability',trait:'Comprehensive, Usable, Data Intelligence, Analytics and Information Management',q:'Can you articulate the specific financial value or cost-savings derived from data-driven decisions and user-led analysis?',a:['The business cannot identify any financial benefit from its data and analysis.','Anecdotal evidence suggests some data-driven improvements but lacks hard data.','Specific business cases track the financial impact of major data and analytics projects.','A formal value-realization framework measures the ROI of all data-led business decisions.','Data is treated as a strategic balance-sheet asset with real-time value tracking and growth.'],w:3.2}

var AREAS = (function() {
  var seen = {}, out = [];
  QUESTIONS.forEach(function(q){ if(!seen[q.area]){seen[q.area]=1;out.push(q.area);} });
  return out;
})();

var GROUPS = AREAS.map(function(area) {
  var qs = QUESTIONS.map(function(q,i){return Object.assign({},q,{idx:i});}).filter(function(q){return q.area===area;});
  var traitSeen = {}, traits = [];
  qs.forEach(function(q){ if(!traitSeen[q.trait]){traitSeen[q.trait]=1;traits.push(q.trait);} });
  return { area:area, traits:traits.map(function(t){ return {trait:t, questions:qs.filter(function(q){return q.trait===t;})}; }) };
});

var answers  = new Array(QUESTIONS.length).fill(null);
var comments = new Array(QUESTIONS.length).fill('');
var currentGroup = 0;
var customerName = '';
var staffName    = '';

// ── helpers ──
function show(id) {
  ['screen-intro','screen-questions','screen-results'].forEach(function(s){
    document.getElementById(s).classList.remove('active');
  });
  var el = document.getElementById(id);
  if(el) el.classList.add('active');
  var tb = document.getElementById('topbar');
  if (tb) tb.style.display = (id === 'screen-intro') ? 'none' : '';
}

function updateProgress() {
  var total = answers.length, done = 0;
  for (var i = 0; i < total; i++) if (answers[i] !== null) done++;
  var pct = (done / total) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent  = done + ' / ' + total;
}
function setProgress(_ignored) { updateProgress(); }

function updateTopbar(meta) {
  document.getElementById('topbar-meta').textContent = meta || '';
}

// ── start ──
function startAssessment() {
  customerName = document.getElementById('inp-customer').value.trim();
  staffName    = document.getElementById('inp-staff').value.trim();
  if (!customerName || !staffName) { alert('Please enter both names.'); return; }
  currentGroup = 0;
  setProgress(0);
  updateTopbar(customerName + ' \u2014 ' + staffName);
  renderGroup();
  show('screen-questions');
  window.scrollTo(0,0);
}

// ── render a section ──
function renderGroup() {
  var g   = GROUPS[currentGroup];
  var pct = (currentGroup / GROUPS.length) * 100;
  setProgress(pct);
  updateTopbar(customerName + ' \u2014 ' + g.area);
  renderTabs();

  var totalQs = g.traits.reduce(function(s,t){return s+t.questions.length;},0);
  document.getElementById('section-hd').innerHTML =
    '<span class="section-badge">Section ' + (currentGroup+1) + ' of ' + GROUPS.length + '</span>' +
    '<h2>' + g.area + '</h2>' +
    '<p class="section-summary">' + escHtml(AREA_SUMMARIES[g.area] || '') + '</p>' + '<p class="section-meta">' + g.traits.length + ' traits \u00a0\u00b7\u00a0 ' + totalQs + ' questions</p>';

  var container = document.getElementById('q-container');
  container.innerHTML = '';

  g.traits.forEach(function(tg) {
    var tDiv = document.createElement('div');
    tDiv.className = 'trait-group';
    var tHd = document.createElement('div');
    tHd.className = 'trait-hd';
    tHd.textContent = tg.trait;
    tDiv.appendChild(tHd);

    tg.questions.forEach(function(q) {
      var val      = answers[q.idx];
      var touched  = val !== null;
      var sliderV  = touched ? val : 1;
      var scoreTxt = touched ? val : '\u2014';
      var wordTxt  = touched ? IML_LABELS[val-1] : 'Not rated';
      var ansTxt   = touched ? q.a[val-1] : 'Move the slider to set a rating.';
      var cmt      = comments[q.idx];
      var card = document.createElement('div');
      card.className = 'q-card' + (touched ? ' touched' : ' untouched');
      card.id = 'card-' + q.idx;
      card.innerHTML =
        '<div class="q-top">' +
          '<div class="q-left">' +
            '<div class="q-num-row">' +
              '<span class="q-num">Q' + (q.idx+1) + '</span>' +
              '<span class="q-weight" title="Priority weighting (1–5, higher = focus first)">Weighting <strong>' + q.w.toFixed(1) + '</strong></span>' +
              (q.f ? '<span class="q-foundational" title="Foundational capability">Foundational</span>' : '') +
            '</div>' +
            '<div class="q-text">' + escHtml(q.q) + '</div>' +
          '</div>' +
          '<div class="iml-live">' +
            '<span class="iml-score" id="iml-score-' + q.idx + '">' + scoreTxt + '</span>' +
            '<span class="iml-word"  id="iml-word-'  + q.idx + '">' + wordTxt + '</span>' +
          '</div>' +
        '</div>' +
        '<input type="range" min="1" max="5" step="1" value="' + sliderV + '" id="slider-' + q.idx + '" oninput="onSlider(' + q.idx + ',this.value)" />' +
        '<div class="slider-ends"><span>1 \u2014 Nascent</span><span>5 \u2014 Innovating</span></div>' +
        '<div class="q-bottom">' +
          '<div class="ans-box">' +
            '<div class="ans-label">Selected answer</div>' +
            '<div class="ans-text' + (touched ? ' lit' : '') + '" id="ans-' + q.idx + '">' + escHtml(ansTxt) + '</div>' +
          '</div>' +
          '<div class="comment-box">' +
            '<div class="comment-label">Commentary (optional)</div>' +
            '<textarea class="comment-input" id="cmt-' + q.idx + '" placeholder="Add context or notes\u2026" oninput="onComment(' + q.idx + ',this.value)">' + escHtml(cmt) + '</textarea>' +
          '</div>' +
        '</div>';
      tDiv.appendChild(card);
    });
    container.appendChild(tDiv);
  });

  document.getElementById('nav-info').textContent = 'Section ' + (currentGroup+1) + ' of ' + GROUPS.length;
  document.getElementById('btn-back').disabled    = currentGroup === 0;
  document.getElementById('btn-next').textContent = currentGroup === GROUPS.length-1 ? 'View results \u2192' : 'Next \u2192';
}

function onSlider(idx, rawVal) {
  var val = parseInt(rawVal);
  var wasNull = answers[idx] === null;
  answers[idx] = val;
  document.getElementById('iml-score-'+idx).textContent = val;
  document.getElementById('iml-word-'+idx).textContent  = IML_LABELS[val-1];
  var ansEl = document.getElementById('ans-'+idx);
  ansEl.textContent = QUESTIONS[idx].a[val-1];
  ansEl.className   = 'ans-text lit';
  var cardEl = document.getElementById('card-'+idx);
  cardEl.classList.add('touched');
  cardEl.classList.remove('untouched');
  if (wasNull) updateProgress();
}

function onComment(idx, val) {
  comments[idx] = val;
}

function nextGroup() {
  // save any comment textarea values before navigating away
  saveComments();
  if (currentGroup < GROUPS.length-1) { currentGroup++; renderGroup(); window.scrollTo(0,0); }
  else {
    var unrated = 0;
    for (var i = 0; i < answers.length; i++) if (answers[i] === null) unrated++;
    if (unrated > 0) { showIncomplete(); return; }
    showResults();
  }
}
function prevGroup() {
  saveComments();
  if (currentGroup > 0) { currentGroup--; renderGroup(); window.scrollTo(0,0); }
}

function saveComments() {
  // Persist textarea values that may not have triggered oninput
  GROUPS[currentGroup].traits.forEach(function(tg) {
    tg.questions.forEach(function(q) {
      var el = document.getElementById('cmt-'+q.idx);
      if (el) comments[q.idx] = el.value;
    });
  });
}

// ── results ──
function showResults() {
  setProgress(100);
  updateTopbar(customerName + ' \u2014 Results');

  var total    = answers.reduce(function(s,v){return s+v;},0);
  var maxTotal = QUESTIONS.length * 5;
  var pct      = Math.round((total/maxTotal)*100);
  var avgIML   = (total/QUESTIONS.length).toFixed(2);
  var imlLevel = Math.min(Math.round(total/QUESTIONS.length),5);

  var areaStats = AREAS.map(function(area) {
    var qs    = QUESTIONS.map(function(q,i){return Object.assign({},q,{idx:i});}).filter(function(q){return q.area===area;});
    var score = qs.reduce(function(s,q){return s+answers[q.idx];},0);
    var max   = qs.length*5;
    return {area:area,score:score,max:max,pct:Math.round((score/max)*100)};
  });

  var allTraits = (function(){var seen={},out=[];QUESTIONS.forEach(function(q){if(!seen[q.trait]){seen[q.trait]=1;out.push(q.trait);}});return out;})();
  var traitStats = allTraits.map(function(trait) {
    var qs    = QUESTIONS.map(function(q,i){return Object.assign({},q,{idx:i});}).filter(function(q){return q.trait===trait;});
    var score = qs.reduce(function(s,q){return s+answers[q.idx];},0);
    var max   = qs.length*5;
    return {trait:trait,area:qs[0].area,score:score,max:max,avg:(score/qs.length).toFixed(1)};
  });

  var AREA_SHORT = {
    'Strategy, Governance and Investment': 'Strategy',
    'Operations, Platform and Service Delivery': 'Operations',
    'Security & Business Resilience': 'Security',
    'Digital Enablement and Future Capability': 'Digital'
  };
  var priorityList = QUESTIONS.map(function(q,i){
    return { idx:i, q:q.q, area:q.area, trait:q.trait, iml:answers[i], w:q.w, f:!!q.f, score:q.w*(6-answers[i]) };
  }).sort(function(a,b){
    if (b.score !== a.score) return b.score - a.score;
    if (b.w !== a.w) return b.w - a.w;
    return a.iml - b.iml;
  });

  var radarSvg  = buildRadar(areaStats);

  }).join('');

  }).join('');

  var priorityRows = priorityList.map(function(p, rank){
    var atMax = p.iml >= 5;
    var nextIml = atMax ? 5 : p.iml + 1;

    var nextTxt = atMax ? '' : QUESTIONS[p.idx].a[p.iml];
    var recs = RECS[p.idx] || [];

    return '<tr class="priority-row" onclick="togglePriority('+rank+')" id="prow-'+rank+'">' +
      '<td style="color:var(--text3);width:56px;font-variant-numeric:tabular-nums;white-space:nowrap"><span class="priority-caret">\u25B6</span> Q'+(p.idx+1)+'</td>' +
      '<td>'+escHtml(p.q)+(p.f?' <span class="q-foundational" style="font-size:9px;padding:1px 7px;margin-left:4px;vertical-align:middle">Foundational</span>':'')+'</td>' +
      '<td style="color:var(--text3);white-space:nowrap">'+escHtml(AREA_SHORT[p.area]||p.area)+'</td>' +
      '<td style="text-align:right;font-variant-numeric:tabular-nums">'+p.iml+'</td>' +
      '<td style="text-align:right;font-variant-numeric:tabular-nums">'+p.w.toFixed(1)+'</td>' +
    '</tr>' +
    '<tr class="priority-detail-row" id="pdetail-'+rank+'" style="display:none">' +
      '<td colspan="5">' +
        '<div class="priority-detail">' +
          '<h4>Current state: IML '+p.iml+' ('+IML_LABELS[p.iml-1]+')</h4>' +
          '<div class="pd-state">'+escHtml(currentTxt)+'</div>' +
          '<h4>Top 5 recommendations to advance</h4>' +
          '<ol>'+recsHtml+'</ol>' +
          (atMax
            ? '<h4>Already at top IML \u2014 focus on sustaining innovation</h4>'
            : '<h4>Target state: IML '+nextIml+' ('+IML_LABELS[nextIml-1]+')</h4>' +
              '<div class="pd-state">'+escHtml(nextTxt)+'</div>') +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join('');

  document.getElementById('results-content').innerHTML =
    '<div class="res-hd">' +
      '<div class="eyebrow">Assessment complete \u2014 '+dateStr+'</div>' +
      '<h1>'+escHtml(customerName)+'</h1>' +
      '<p>Assessed by '+escHtml(staffName)+'</p>' +
    '</div>' +
    '<div class="meta-grid">' +
      '<div class="meta-card"><div class="lbl">Customer</div><div class="val">'+escHtml(customerName)+'</div></div>' +
      '<div class="meta-card"><div class="lbl">Assessed by</div><div class="val">'+escHtml(staffName)+'</div></div>' +
      '<div class="meta-card"><div class="lbl">Date</div><div class="val">'+dateStr+'</div></div>' +
      '<div class="meta-card"><div class="lbl">Questions</div><div class="val">'+QUESTIONS.length+' / '+QUESTIONS.length+'</div></div>' +
    '</div>' +
    '<div class="score-display">' +
      '<div class="score-lbl">Total score</div>' +
      '<div><span class="score-big">'+total+'</span><span class="score-denom"> / '+maxTotal+'</span></div>' +
      '<div class="score-pct">'+pct+'%</div>' +
      '<div class="iml-chip">Overall IML '+avgIML+' \u2014 '+IML_LABELS[imlLevel-1]+'</div>' +
    '</div>' +
    '<div class="charts-row">' +
      '<div class="chart-wrap"><div class="chart-title">Maturity by area</div>'+radarSvg+'</div>' +
      '<div class="chart-wrap"><div class="chart-title">Rating distribution</div>'+donutData.svg+donutData.legend+'</div>' +
    '</div>' +
    '<div class="breakdown"><h3>Score by area</h3>'+areaRows+'</div>' +
    '<div class="breakdown"><h3>Score by trait</h3>' +
      '<table class="trait-tbl"><thead><tr><th>Trait</th><th>Area</th><th>Avg IML</th><th>Score</th></tr></thead>' +
      '<tbody>'+traitRows+'</tbody></table>' +
    '</div>' +
    '<div class="breakdown"><h3>Priority focus order</h3>' +
      '<p style="font-size:12px;color:var(--text3);margin-bottom:1rem;line-height:1.5;max-width:560px">Click any row to expand the top 5 recommendations to advance to the next IML level.</p>' +
      '<div style="overflow-x:auto"><table class="trait-tbl"><thead><tr><th style="width:56px">Q#</th><th>Question</th><th>Area</th><th style="text-align:right">IML</th><th style="text-align:right">Weight</th></tr></thead>' +
      '<tbody>'+priorityRows+'</tbody></table></div>' +
    '</div>' +
    '<div class="res-actions">' +
      '<button class="btn btn-primary" onclick="exportXLSX()">Export to Excel</button>' +
      '<button class="btn" onclick="resetForm()">New assessment</button>' +
    '</div>';

  show('screen-results');
  window.scrollTo(0,0);

  requestAnimationFrame(function(){
    document.querySelectorAll('.bar-fill').forEach(function(el,i){
      var p = el.getAttribute('data-pct');
      setTimeout(function(){ el.style.width = p+'%'; }, 80+i*130);
    });
  });
}
